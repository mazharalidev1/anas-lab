[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "anas-diagnostics-schemas"
version = "0.1.0"
description = "Shared diagnostics data contracts"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3.0"]
[tool.setuptools.packages.find]
where = ["src"]
