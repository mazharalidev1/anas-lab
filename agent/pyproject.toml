[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "anas-diagnostics-agent"
version = "0.1.0"
description = "Lightweight Linux host diagnostics agent"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["psutil>=6.0,<8.0", "httpx>=0.27,<1.0", "pydantic>=2.8,<3.0", "pydantic-settings>=2.4,<3.0"]
[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]
[tool.setuptools.packages.find]
where = ["src"]
