services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diagnostics}
      POSTGRES_USER: ${POSTGRES_USER:-diagnostics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: {context: .., dockerfile: docker/Dockerfile.server}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-diagnostics}:${POSTGRES_PASSWORD:-change-this-local-password}@postgres:5432/${POSTGRES_DB:-diagnostics}
      AGENT_TOKEN: ${AGENT_TOKEN:-change-this-agent-token}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build: {context: .., dockerfile: docker/Dockerfile.worker}
    environment: {REDIS_URL: redis://redis:6379/0}
    depends_on:
      redis: {condition: service_healthy}
volumes:
  postgres_data:
